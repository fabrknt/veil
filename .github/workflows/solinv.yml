# Fails a pull request or a push that removes an Anchor account check
# (has_one, seeds, constraint, signer, ...), with an annotation on the line.
# https://github.com/psyto/solinv
name: solinv diff

on:
  pull_request:
    paths:
      - apps/*/programs/**
      - .github/workflows/solinv.yml
  push:
    branches: [main]
    paths:
      - apps/*/programs/**
      - .github/workflows/solinv.yml

permissions:
  contents: read

jobs:
  account-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: psyto/solinv@eb75c260c1ff95ce18196ecde07a46779a142d42
        with:
          program-src: |
            apps/confidential-swap-router/programs/confidential-swap-router/src
            apps/dark-pool/programs/veil-dark-pool/src
            apps/darkflow/programs/darkflow/src
            apps/rwa-secrets-service/programs/rwa-secrets/src
            apps/umbra/programs/umbra-swap/src
