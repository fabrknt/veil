# Fails a pull request that removes an account check (has_one, seeds,
# constraint, signer, ...) from one of the Anchor programs, with an
# annotation on the line. https://github.com/psyto/solinv
name: solinv diff

on:
  pull_request:
    paths:
      - apps/*/programs/**
      - .github/workflows/solinv.yml

permissions:
  contents: read

jobs:
  account-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: psyto/solinv@4a800dc3fb1cb91cff8254aafb30cef7b71f732c
        with:
          program-src: |
            apps/confidential-swap-router/programs/confidential-swap-router/src
            apps/dark-pool/programs/veil-dark-pool/src
            apps/darkflow/programs/darkflow/src
            apps/rwa-secrets-service/programs/rwa-secrets/src
            apps/umbra/programs/umbra-swap/src
